
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio69 AR Video</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }

    #scanScreen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      background: #101827;
      z-index: 1;
    }

    #scanScreen h1 {
      margin-bottom: 10px;
      color: #38bdf8;
    }

    #status {
      margin: 18px 0;
      line-height: 1.6;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 14px 22px;
      margin: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #0284c7;
      color: white;
    }

    #arScene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: none;
    }

    #videoScreen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 12px;
      background: #000;
      z-index: 10;
    }

    #finalVideo {
      display: block;
      width: 100%;
      max-width: 1100px;
      max-height: 78vh;
      object-fit: contain;
      background: #000;
    }

    #videoMessage {
      text-align: center;
      color: white;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <section id="scanScreen">
    <h1>Studio69 AR</h1>
    <p>Scan your target picture to open the video.</p>
    <div id="status">Press Start Scanning to begin.</div>
    <button id="startButton">Start Scanning</button>
  </section>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./target.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="imageTarget"
      mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>

  <section id="videoScreen">
    <video
      id="finalVideo"
      src="./video.mp4"
      controls
      playsinline
      webkit-playsinline
      preload="auto">
    </video>

    <div id="videoMessage">
      Your video is independent of the scanned picture.
    </div>

    <button id="scanAgainButton">Scan Again</button>
  </section>

  <script>
    const scanScreen = document.getElementById("scanScreen");
    const arScene = document.getElementById("arScene");
    const status = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    const videoScreen = document.getElementById("videoScreen");
    const finalVideo = document.getElementById("finalVideo");
    const videoMessage = document.getElementById("videoMessage");
    const scanAgainButton = document.getElementById("scanAgainButton");
    const imageTarget = document.getElementById("imageTarget");

    let scanningStarted = false;
    let targetDetected = false;

    startButton.addEventListener("click", async () => {
      if (scanningStarted) return;

      scanningStarted = true;
      startButton.disabled = true;
      status.textContent = "Starting camera. Please allow camera access.";

      arScene.style.display = "block";

      try {
        await arScene.systems["mindar-image-system"].start();
        status.textContent = "Camera is ready. Point it at your target picture.";
      } catch (error) {
        console.error("Camera start error:", error);
        arScene.style.display = "none";
        scanningStarted = false;
        startButton.disabled = false;
        status.textContent =
          "Camera could not start. Check camera permission and try again.";
      }
    });

    imageTarget.addEventListener("targetFound", async () => {
      if (targetDetected) return;
      targetDetected = true;

      status.textContent = "Picture detected. Opening video...";

      // Show the video in its own fixed screen.
      // It is NOT attached to the AR target.
      videoScreen.style.display = "flex";
      scanScreen.style.display = "none";

      // Stop AR tracking and camera after detection.
      try {
        await arScene.systems["mindar-image-system"].stop();
      } catch (error) {
        console.warn("Camera stop notice:", error);
      }

      arScene.style.display = "none";

      // The video stays visible even after the picture is removed.
      try {
        await finalVideo.play();
        videoMessage.textContent = "Video playing.";
      } catch (error) {
        console.warn("Video playback needs user interaction:", error);
        videoMessage.textContent =
          "If the video does not start, press Play on the video controls.";
      }
    });

    scanAgainButton.addEventListener("click", async () => {
      finalVideo.pause();
      finalVideo.currentTime = 0;

      videoScreen.style.display = "none";
      scanScreen.style.display = "flex";
      arScene.style.display = "none";

      targetDetected = false;
      scanningStarted = false;
      startButton.disabled = false;
      status.textContent = "Press Start Scanning to begin.";
    });

    finalVideo.addEventListener("ended", () => {
      videoMessage.textContent = "Video finished. Press Scan Again to scan another picture.";
    });

    finalVideo.addEventListener("error", () => {
      videoMessage.textContent =
        "Video could not load. Check that video.mp4 exists in the same folder.";
    });
  </script>

</body>
</html>
