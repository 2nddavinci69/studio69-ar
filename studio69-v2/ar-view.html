
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio69 AR V2</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header { padding: 16px; }
    h1 { margin: 0 0 8px; color: #38bdf8; }
    #status { padding: 12px; font-size: 15px; }

    button {
      padding: 13px 22px;
      margin: 8px;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn { background: #38bdf8; color: #082f49; }
    #stopBtn { background: #e5e7eb; color: #111827; }

    #arScene {
      width: 100%;
      height: 55vh;
      min-height: 300px;
      background: #202b3b;
    }

    #videoBox {
      display: none;
      padding: 12px;
    }

    #videoBox video {
      width: 100%;
      max-height: 65vh;
      background: black;
      border-radius: 10px;
    }

    .hint { color: #cbd5e1; padding: 12px; }
  </style>
</head>

<body>
  <header>
    <h1>Studio69 AR</h1>
    <div>Scan the target image. Watch the video.</div>
  </header>

  <div id="status">Press Start Camera to begin.</div>

  <button id="startBtn">Start Camera</button>
  <button id="stopBtn">Stop Camera</button>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./target.mind; autoStart: false; uiLoading: no; uiScanning: yes; uiError: no;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">
    </a-entity>
  </a-scene>

  <div id="videoBox">
    <h2>Studio69 Video</h2>
    <video
      id="video"
      src="./video.mp4"
      controls
      playsinline
      webkit-playsinline
      preload="metadata">
    </video>
    <p class="hint">
      If playback does not start automatically, press Play.
    </p>
  </div>

  <script>
    const scene = document.querySelector("#arScene");
    const statusBox = document.querySelector("#status");
    const startBtn = document.querySelector("#startBtn");
    const stopBtn = document.querySelector("#stopBtn");
    const target = document.querySelector("#target");
    const video = document.querySelector("#video");
    const videoBox = document.querySelector("#videoBox");

    let cameraStarted = false;
    let targetDetected = false;

    video.addEventListener("error", () => {
      statusBox.textContent =
        "Video error. Check that studio69-v2/video.mp4 exists.";
    });

    video.addEventListener("canplay", () => {
      statusBox.textContent = targetDetected
        ? "Target found. Video is ready."
        : "Video ready. Point camera at the target image.";
    });

    scene.addEventListener("loaded", () => {
      statusBox.textContent = "Ready. Press Start Camera.";
    });

    target.addEventListener("targetFound", async () => {
      targetDetected = true;
      videoBox.style.display = "block";
      statusBox.textContent = "Target found! Starting video...";

      try {
        await video.play();
        statusBox.textContent = "Target found. Video playing.";
      } catch (error) {
        statusBox.textContent =
          "Target found. Press Play on the video.";
      }
    });

    target.addEventListener("targetLost", () => {
      statusBox.textContent =
        "Target lost. Video will continue playing.";
      // Intentionally do not pause the video.
    });

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      statusBox.textContent = "Starting camera...";

      try {
        await new Promise(resolve => {
          if (scene.hasLoaded) resolve();
          else scene.addEventListener("loaded", resolve, { once: true });
        });

        const arSystem = scene.systems["mindar-image-system"];

        if (!arSystem) {
          throw new Error("MindAR system was not found.");
        }

        await arSystem.start();
        cameraStarted = true;
        statusBox.textContent =
          "Camera started. Point it at the target image.";
      } catch (error) {
        statusBox.textContent =
          "Camera failed: " + error.message +
          ". Check HTTPS and camera permission.";
        startBtn.disabled = false;
      }
    });

    stopBtn.addEventListener("click", async () => {
      try {
        const arSystem = scene.systems["mindar-image-system"];
        if (arSystem && cameraStarted) await arSystem.stop();
      } catch (error) {
        console.log(error);
      }

      cameraStarted = false;
      startBtn.disabled = false;
      statusBox.textContent = "Camera stopped.";
    });
  </script>
</body>
</html>
