
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Studio69 AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #scanScreen {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      text-align: center;
      color: #fff;
      background: #101827;
    }

    #scanScreen h1 {
      color: #38bdf8;
      margin-bottom: 8px;
    }

    #status {
      line-height: 1.6;
      margin: 18px 0;
    }

    button {
      padding: 14px 22px;
      border: 0;
      border-radius: 10px;
      background: #0284c7;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    /* AR camera is only used for scanning */
    #arScene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: none;
    }

    /* Independent full-screen video layer */
    #videoScreen {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;

      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;

      margin: 0 !important;
      padding: 10px;
      border: 0;

      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;

      background: #000;
      overflow: hidden;

      z-index: 2147483647 !important;
      isolation: isolate;
      transform: none !important;
    }

    #finalVideo {
      position: relative !important;
      inset: auto !important;

      display: block;
      width: 100%;
      height: auto;

      max-width: 100%;
      max-height: calc(100dvh - 90px);

      margin: 0 auto;
      padding: 0;

      object-fit: contain;
      background: #000;

      transform: none !important;
      flex: 0 1 auto;
    }

    #videoMessage {
      color: #fff;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }

    #videoScreen button {
      flex: 0 0 auto;
    }
  </style>
</head>

<body>

  <section id="scanScreen">
    <h1>Studio69 AR</h1>
    <p>Scan your target picture to play the video.</p>

    <div id="status">
      Press Start Scanning to begin.
    </div>

    <button id="startButton">Start Scanning</button>
  </section>

  <a-scene
    id="arScene"
    mindar-image="
      imageTargetSrc: ./target.mind;
      autoStart: false;
      uiLoading: no;
      uiError: no;
      uiScanning: no;
    "
    color-space="sRGB"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="imageTarget"
      mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>

  <!-- This video layer is outside the AR scene -->
  <section id="videoScreen">

    <video
      id="finalVideo"
      src="./video.mp4"
      controls
      playsinline
      webkit-playsinline
      preload="auto">
    </video>

    <div id="videoMessage">
      Video ready.
    </div>

    <button id="scanAgainButton">Scan Again</button>

  </section>

  <script>
    const scanScreen = document.getElementById("scanScreen");
    const arScene = document.getElementById("arScene");
    const imageTarget = document.getElementById("imageTarget");

    const status = document.getElementById("status");
    const startButton = document.getElementById("startButton");

    const videoScreen = document.getElementById("videoScreen");
    const finalVideo = document.getElementById("finalVideo");
    const videoMessage = document.getElementById("videoMessage");
    const scanAgainButton = document.getElementById("scanAgainButton");

    let scanning = false;
    let detected = false;

    function waitForScene() {
      if (arScene.hasLoaded) {
        return Promise.resolve();
      }

      return new Promise((resolve) => {
        arScene.addEventListener("loaded", resolve, { once: true });
      });
    }

    startButton.addEventListener("click", async () => {
      if (scanning) return;

      scanning = true;
      startButton.disabled = true;
      status.textContent = "Starting camera...";

      try {
        arScene.style.display = "block";

        await waitForScene();

        await arScene.systems["mindar-image-system"].start();

        status.textContent =
          "Camera ready. Point it at your target picture.";

      } catch (error) {
        console.error("AR start error:", error);

        arScene.style.display = "none";
        scanning = false;
        startButton.disabled = false;

        status.textContent =
          "Camera could not start. Check permission and target.mind.";
      }
    });

    imageTarget.addEventListener("targetFound", async () => {
      if (detected) return;
      detected = true;

      status.textContent = "Picture detected. Opening video...";

      /*
        Show the independent video layer first.
        It is not inside the AR scene.
      */
      videoScreen.style.display = "flex";
      scanScreen.style.display = "none";

      /*
        Stop image tracking and camera, then remove
        the complete AR scene from the page.
      */
      try {
        await arScene.systems["mindar-image-system"].stop();
      } catch (error) {
        console.warn("AR stop notice:", error);
      }

      arScene.style.display = "none";

      if (arScene.parentNode) {
        arScene.parentNode.removeChild(arScene);
      }

      /*
        The video remains in its independent fixed layer.
        Removing the target cannot stop the video.
      */
      try {
        await finalVideo.play();
        videoMessage.textContent = "Video playing.";

      } catch (error) {
        console.warn("Tap Play if automatic playback is blocked.", error);

        videoMessage.textContent =
          "Press Play on the video controls to start playback.";
      }
    });

    finalVideo.addEventListener("error", () => {
      videoMessage.textContent =
        "Video could not load. Check video.mp4 in this folder.";
    });

    finalVideo.addEventListener("ended", () => {
      videoMessage.textContent =
        "Video finished. Press Scan Again to start over.";
    });

    scanAgainButton.addEventListener("click", () => {
      /*
        Reloading restores the AR scene and allows
        another scan from a clean state.
      */
      window.location.reload();
    });
  </script>

</body>
</html>
