
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio69 AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
    }

    #help {
      position: fixed;
      z-index: 10;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px;
      text-align: center;
      background: #101827;
    }

    h1 { color: #38bdf8; margin: 0 0 8px; }

    #status { padding: 10px; line-height: 1.5; }

    button {
      padding: 12px 18px;
      margin: 5px;
      border: 0;
      border-radius: 8px;
      font-weight: bold;
      font-size: 16px;
    }

    #startBtn { background: #38bdf8; color: #082f49; }
    #scanAgainBtn { background: #e2e8f0; color: #111827; }

    #arScene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #videoScreen {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: black;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    #finalVideo {
      width: 100%;
      height: 85%;
      object-fit: contain;
      background: black;
    }

    #videoActions {
      width: 100%;
      padding: 8px;
      text-align: center;
      background: #101827;
      color: white;
    }

    body.video-mode #help { display: none; }
  </style>
</head>

<body>
  <div id="help">
    <h1>Studio69 AR</h1>
    <div>Scan the target image. Watch the video.</div>
    <div id="status">Press Start Camera.</div>
    <button id="startBtn">Start Camera</button>
  </div>

  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./target.mind; autoStart: false; uiScanning: yes; uiLoading: no;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">
    </a-entity>
  </a-scene>

  <section id="videoScreen">
    <video
      id="finalVideo"
      src="./video.mp4"
      controls
      playsinline
      webkit-playsinline
      preload="auto">
    </video>

    <div id="videoActions">
      <div id="videoStatus">Video ready.</div>
      <button id="scanAgainBtn">Scan Again</button>
    </div>
  </section>

  <script>
    const scene = document.getElementById("arScene");
    const target = document.getElementById("target");
    const status = document.getElementById("status");
    const videoScreen = document.getElementById("videoScreen");
    const finalVideo = document.getElementById("finalVideo");
    const videoStatus = document.getElementById("videoStatus");
    const startBtn = document.getElementById("startBtn");
    const scanAgainBtn = document.getElementById("scanAgainBtn");

    let cameraStarted = false;
    let openingVideo = false;

    function getARSystem() {
      return scene.systems["mindar-image-system"];
    }

    async function stopCamera() {
      const system = getARSystem();

      if (system && cameraStarted) {
        try {
          await system.stop();
        } catch (error) {
          console.warn("Camera stop:", error);
        }
      }

      cameraStarted = false;
    }

    async function openVideo() {
      if (openingVideo) return;
      openingVideo = true;

      status.textContent = "Image recognized. Opening video.";

      // Stop camera before showing the independent video player.
      await stopCamera();

      scene.style.display = "none";
      document.body.classList.add("video-mode");
      videoScreen.style.display = "flex";

      try {
        await finalVideo.play();
        videoStatus.textContent = "Video playing. Camera is stopped.";
      } catch (error) {
        videoStatus.textContent = "Tap Play to start the video.";
      }

      openingVideo = false;
    }

    scene.addEventListener("loaded", () => {
      status.textContent = "Ready. Press Start Camera.";
    });

    scene.addEventListener("arError", event => {
      status.textContent =
        "AR error. Check camera permission and target.mind.";
      console.error(event);
      startBtn.disabled = false;
    });

    target.addEventListener("targetFound", openVideo);

    target.addEventListener("targetLost", () => {
      // Intentionally do not pause the independent video.
      if (!openingVideo) {
        status.textContent = "Target lost.";
      }
    });

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      status.textContent = "Starting camera...";

      try {
        if (!scene.hasLoaded) {
          await new Promise((resolve, reject) => {
            const timer = setTimeout(
              () => reject(new Error("AR loading timed out")),
              15000
            );

            scene.addEventListener("loaded", () => {
              clearTimeout(timer);
              resolve();
            }, { once: true });
          });
        }

        const system = getARSystem();

        if (!system) {
          throw new Error("MindAR system not found.");
        }

        await system.start();
        cameraStarted = true;
        status.textContent = "Camera started. Scan the original target image.";
      } catch (error) {
        console.error(error);
        status.textContent = "Camera error: " + error.message;
        startBtn.disabled = false;
      }
    });

    scanAgainBtn.addEventListener("click", async () => {
      finalVideo.pause();
      finalVideo.currentTime = 0;

      videoScreen.style.display = "none";
      scene.style.display = "block";
      document.body.classList.remove("video-mode");

      openingVideo = false;
      startBtn.disabled = false;
      status.textContent = "Press Start Camera to scan again.";
    });

    finalVideo.addEventListener("error", () => {
      videoStatus.textContent =
        "Video failed to load. Check the root video.mp4 file.";
    });

    window.addEventListener("pagehide", () => {
      finalVideo.pause();
      stopCamera();
    });
  </script>
</body>
</html>
