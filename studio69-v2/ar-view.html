
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Studio69 AR Player</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #help {
      position: fixed;
      z-index: 20;
      top: 0;
      left: 0;
      right: 0;
      padding: 18px 12px;
      background: #101827;
      text-align: center;
    }

    #help h1 {
      margin: 0 0 8px;
      color: #38bdf8;
      font-size: 25px;
    }

    #status {
      padding: 8px;
      font-size: 14px;
      line-height: 1.5;
    }

    button {
      margin: 6px;
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startBtn {
      background: #38bdf8;
      color: #082f49;
    }

    #stopBtn, #scanAgainBtn {
      background: #e2e8f0;
      color: #111827;
    }

    #arScene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Separate video screen, independent of the camera */
    #videoScreen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    }

    #finalVideo {
      display: block;
      width: 100%;
      height: 82%;
      object-fit: contain;
      background: #000;
    }

    #videoActions {
      width: 100%;
      text-align: center;
      padding: 8px;
      background: #101827;
    }

    #videoNote {
      margin: 5px;
      color: #cbd5e1;
      font-size: 13px;
    }

    body.video-mode {
      overflow: hidden;
    }

    body.video-mode #help {
      display: none;
    }
  </style>
</head>

<body>
  <div id="help">
    <h1>Studio69 AR</h1>
    <div>Scan the target image. Watch the video.</div>
    <div id="status">Press Start Camera to begin.</div>
    <button id="startBtn">Start Camera</button>
    <button id="stopBtn">Stop Camera</button>
  </div>

  <!-- AR camera and image recognition -->
  <a-scene
    id="arScene"
    mindar-image="imageTargetSrc: ./target.mind; autoStart: false; uiLoading: no; uiScanning: yes; uiError: no;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video
        id="arVideo"
        src="./video.mp4"
        preload="auto"
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous">
      </video>
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="imageTarget"
      mindar-image-target="targetIndex: 0">

      <a-video
        src="#arVideo"
        position="0 0 0"
        width="1"
        height="0.5625">
      </a-video>

    </a-entity>
  </a-scene>

  <!-- Independent video player, not attached to the target -->
  <section id="videoScreen">
    <video
      id="finalVideo"
      src="./video.mp4"
      controls
      playsinline
      webkit-playsinline
      preload="auto">
    </video>

    <div id="videoActions">
      <div id="videoNote">
        Video is independent of the camera. Use controls for sound.
      </div>
      <button id="scanAgainBtn">Scan Again</button>
    </div>
  </section>

  <script>
    const scene = document.getElementById("arScene");
    const target = document.getElementById("imageTarget");
    const arVideo = document.getElementById("arVideo");
    const finalVideo = document.getElementById("finalVideo");

    const help = document.getElementById("help");
    const status = document.getElementById("status");
    const videoScreen = document.getElementById("videoScreen");

    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const scanAgainBtn = document.getElementById("scanAgainBtn");

    let cameraStarted = false;
    let switching = false;
    let arSystem = null;

    function setStatus(message) {
      status.textContent = message;
    }

    function getARSystem() {
      return scene.systems["mindar-image-system"];
    }

    async function stopCamera() {
      arSystem = getARSystem();

      if (arSystem && cameraStarted) {
        try {
          await arSystem.stop();
        } catch (error) {
          console.warn("Could not stop AR camera:", error);
        }
      }

      cameraStarted = false;
    }

    async function showIndependentVideo() {
      if (switching) return;
      switching = true;

      setStatus("Image recognized. Opening video...");

      // Remember playback position from the AR video.
      const startTime = Number.isFinite(arVideo.currentTime)
        ? arVideo.currentTime
        : 0;

      // Stop the AR video and detach the camera view.
      arVideo.pause();
      await stopCamera();

      // Show a separate, screen-fixed video player.
      document.body.classList.add("video-mode");
      scene.style.display = "none";
      videoScreen.style.display = "flex";

      try {
        await new Promise(resolve => {
          if (finalVideo.readyState >= 2) {
            resolve();
          } else {
            finalVideo.addEventListener("loadeddata", resolve, { once: true });
            finalVideo.addEventListener("error", resolve, { once: true });
          }
        });

        if (finalVideo.error) {
          throw new Error("The video file could not be loaded.");
        }

        if (startTime > 0 && Number.isFinite(finalVideo.duration)) {
          finalVideo.currentTime = Math.min(
            startTime,
            Math.max(0, finalVideo.duration - 0.1)
          );
        }

        // Autoplay may be blocked by some browsers.
        try {
          await finalVideo.play();
          document.getElementById("videoNote").textContent =
            "Video playing. Use the player controls for sound.";
        } catch (error) {
          document.getElementById("videoNote").textContent =
            "Tap Play on the video. Use the player controls for sound.";
        }
      } catch (error) {
        document.getElementById("videoNote").textContent =
          "Video could not load. Check the root video.mp4 file.";
        console.error(error);
      }

      switching = false;
    }

    scene.addEventListener("loaded", () => {
      setStatus("Ready. Press Start Camera.");
    });

    scene.addEventListener("arReady", () => {
      setStatus("Camera ready. Point it at the target image.");
    });

    scene.addEventListener("arError", event => {
      setStatus("AR error. Check camera permission and target.mind.");
      console.error("MindAR error:", event);
      startBtn.disabled = false;
    });

    target.addEventListener("targetFound", () => {
      showIndependentVideo();
    });

    target.addEventListener("targetLost", () => {
      // Do not pause the independent video.
      if (!switching && !document.body.classList.contains("video-mode")) {
        setStatus("Target lost. Keep the target image in view.");
      }
    });

    startBtn.addEventListener("click", async () => {
      startBtn.disabled = true;
      setStatus("Starting camera...");

      try {
        if (!scene.hasLoaded) {
          await new Promise((resolve, reject) => {
            const timer = setTimeout(
              () => reject(new Error("AR scene loading timed out.")),
              15000
            );

            scene.addEventListener("loaded", () => {
              clearTimeout(timer);
              resolve();
            }, { once: true });
          });
        }

        arSystem = getARSystem();

        if (!arSystem) {
          throw new Error("MindAR system not found. Reload this page.");
        }

        await arSystem.start();
        cameraStarted = true;
        setStatus("Camera started. Scan the original target image.");
      } catch (error) {
        console.error(error);
        setStatus("Camera error: " + error.message);
        startBtn.disabled = false;
      }
    });

    stopBtn.addEventListener("click", async () => {
      await stopCamera();
      startBtn.disabled = false;
      setStatus("Camera stopped.");
    });

    scanAgainBtn.addEventListener("click", async () => {
      finalVideo.pause();
      finalVideo.currentTime = 0;

      videoScreen.style.display = "none";
      scene.style.display = "block";
      document.body.classList.remove("video-mode");

      switching = false;
      startBtn.disabled = false;

      setStatus("Press Start Camera to scan again.");
    });

    window.addEventListener("pagehide", () => {
      arVideo.pause();
      finalVideo.pause();
      stopCamera();
    });
  </script>
</body>
</html>
