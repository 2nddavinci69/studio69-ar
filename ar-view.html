```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<title>Studio69 AR Player</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: transparent;
  font-family: Arial, sans-serif;
}

/* Camera feed: keep it visible behind the AR canvas */
video.mindar-video {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  z-index: 0 !important;
  background: transparent !important;
}

/* AR scene and canvas must remain transparent */
a-scene {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  background: transparent !important;
  z-index: 1 !important;
}

a-scene canvas {
  background: transparent !important;
}

#message {
  position: fixed;
  z-index: 100;
  top: 12px;
  left: 12px;
  right: 12px;
  padding: 14px;
  background: rgba(15, 15, 15, 0.88);
  color: #fff;
  border: 1px solid #ff7900;
  border-radius: 10px;
  text-align: center;
}

#message p {
  margin: 9px 0;
  font-size: 15px;
  line-height: 1.5;
}

#startButton {
  margin-top: 5px;
  padding: 12px 22px;
  border: none;
  border-radius: 7px;
  background: #ff7900;
  color: #111;
  font-size: 16px;
  font-weight: bold;
}

#startButton:disabled {
  opacity: 0.7;
}

#videoScreen {
  display: none;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  background: #000;
  z-index: 10000;
}

#fullVideo {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

body.video-mode #message,
body.video-mode a-scene,
body.video-mode video.mindar-video {
  display: none !important;
}
</style>
</head>

<body>

<div id="message">
  <strong>Studio69 AR</strong>
  <p id="status">
    Tap Start Camera, then point your camera at the target picture.
  </p>
  <button id="startButton" type="button">Start Camera</button>
</div>

<div id="videoScreen">
  <video
    id="fullVideo"
    src="./video.mp4"
    preload="auto"
    playsinline
    webkit-playsinline
    controls>
  </video>
</div>

<a-scene
  id="arScene"
  embedded
  mindar-image="
    imageTargetSrc: ./target.mind;
    autoStart: false;
    uiLoading: no;
    uiScanning: no;
    uiError: no;
  "
  renderer="alpha: true; colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="targetEntity"
    mindar-image-target="targetIndex: 0">
  </a-entity>

</a-scene>

<script>
(() => {
  const scene = document.getElementById('arScene');
  const message = document.getElementById('message');
  const status = document.getElementById('status');
  const startButton = document.getElementById('startButton');
  const videoScreen = document.getElementById('videoScreen');
  const video = document.getElementById('fullVideo');
  const target = document.getElementById('targetEntity');

  let cameraStarted = false;
  let targetDetected = false;

  startButton.addEventListener('click', async () => {
    if (cameraStarted) return;

    startButton.disabled = true;
    startButton.textContent = 'Starting Camera...';
    status.textContent = 'Please allow camera access.';

    try {
      const arSystem = scene.systems['mindar-image-system'];

      if (!arSystem) {
        throw new Error('MindAR system is not ready.');
      }

      await arSystem.start();

      cameraStarted = true;
      startButton.textContent = 'Scanning...';
      status.textContent =
        'Keep the complete target picture in view. The camera image should remain visible.';

    } catch (error) {
      console.error('Camera start error:', error);

      startButton.disabled = false;
      startButton.textContent = 'Try Again';
      status.textContent =
        'Camera could not start. Check camera permission and internet connection.';
    }
  });

  target.addEventListener('targetFound', async () => {
    if (targetDetected) return;
    targetDetected = true;

    status.textContent = 'Target found. Starting video...';

    // Display the independent video player.
    document.body.classList.add('video-mode');
    videoScreen.style.display = 'block';

    // Stop image tracking; video playback is now independent.
    try {
      const arSystem = scene.systems['mindar-image-system'];
      if (arSystem) {
        arSystem.stop();
      }
    } catch (error) {
      console.warn('AR stop warning:', error);
    }

    try {
      video.currentTime = 0;
      await video.play();
    } catch (error) {
      console.warn('Video playback needs a tap:', error);

      // Keep video controls available if autoplay is blocked.
      video.controls = true;
      videoScreen.style.display = 'block';
    }
  });

  video.addEventListener('error', () => {
    console.error('Video loading error:', video.error);
    videoScreen.style.display = 'block';
  });
})();
</script>

</body>
</html>
```
