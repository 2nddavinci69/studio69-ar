
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio69 AR Player</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

a-scene {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 1;
}

#message {
  position: fixed;
  z-index: 20;
  top: 12px;
  left: 12px;
  right: 12px;
  padding: 12px;
  background: #171717;
  color: white;
  border: 1px solid #ff7900;
  border-radius: 10px;
  text-align: center;
}

#startButton {
  margin-top: 10px;
  padding: 12px 22px;
  border: none;
  border-radius: 7px;
  background: #ff7900;
  color: #111;
  font-size: 16px;
  font-weight: bold;
}

#videoScreen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10000;
  width: 100%;
  height: 100%;
  height: 100dvh;
  background: #000;
}

#fullVideo {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

body.video-mode a-scene,
body.video-mode #message {
  display: none !important;
}
</style>
</head>

<body>

<div id="message">
  <strong>Studio69 AR</strong>
  <p>Point your camera at the target picture.</p>
  <button id="startButton" type="button">Start Camera</button>
</div>

<div id="videoScreen">
  <video
    id="fullVideo"
    src="./video.mp4"
    preload="auto"
    playsinline
    webkit-playsinline
    controls>
  </video>
</div>

<a-scene
  id="arScene"
  mindar-image="
    imageTargetSrc: ./target.mind;
    autoStart: false;
    uiLoading: no;
    uiScanning: yes;
    uiError: no;
  "
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="targetEntity"
    mindar-image-target="targetIndex: 0">
  </a-entity>

</a-scene>

<script>
(() => {
  const scene = document.getElementById('arScene');
  const message = document.getElementById('message');
  const startButton = document.getElementById('startButton');
  const videoScreen = document.getElementById('videoScreen');
  const video = document.getElementById('fullVideo');
  const target = document.getElementById('targetEntity');

  let cameraStarted = false;
  let targetDetected = false;

  startButton.addEventListener('click', async () => {
    if (cameraStarted) return;

    startButton.disabled = true;
    startButton.textContent = 'Starting Camera...';

    try {
      const arSystem = scene.systems['mindar-image-system'];

      if (!arSystem) {
        throw new Error('MindAR system is not ready');
      }

      await arSystem.start();

      cameraStarted = true;
      startButton.textContent = 'Scanning...';

      message.querySelector('p').textContent =
        'Keep the complete target picture visible in the camera.';
    } catch (error) {
      console.error('Camera start error:', error);

      startButton.disabled = false;
      startButton.textContent = 'Try Again';

      message.querySelector('p').textContent =
        'Camera failed. Allow camera access and try again.';
    }
  });

  target.addEventListener('targetFound', async () => {
    if (targetDetected) return;
    targetDetected = true;

    // Show the independent video player after target recognition.
    videoScreen.style.display = 'block';
    document.body.classList.add('video-mode');

    // Stop image tracking only after the target has been found.
    try {
      const arSystem = scene.systems['mindar-image-system'];

      if (arSystem) {
        arSystem.stop();
      }
    } catch (error) {
      console.warn('Could not stop AR:', error);
    }

    // The video is independent of the scanned image.
    try {
      await video.play();
    } catch (error) {
      console.warn('Playback needs a user tap:', error);
      video.controls = true;
    }
  });

  // Do not pause video on targetLost.
  // Once playback starts, the target may leave the camera view.

  video.addEventListener('ended', () => {
    videoScreen.style.display = 'block';
  });

  video.addEventListener('error', () => {
    console.error('Video failed to load. Check video.mp4.');
  });
})();
</script>

</body>
</html>
