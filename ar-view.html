<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Studio69 AR</title>
  <link rel="manifest" href="./manifest.json">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
    }

    #arScene {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1;
    }

    #arScene canvas {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
    }

    /* Keep the live camera preview full-screen */
    video.mindar-video {
      position: fixed !important;
      inset: 0 !important;
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      z-index: 0 !important;
    }

    #topPanel {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      z-index: 10;
      text-align: center;
      padding: 14px;
      border-radius: 16px;
      background: rgba(8, 18, 38, 0.88);
      border: 1px solid rgba(255,255,255,.15);
      box-shadow: 0 5px 24px rgba(0,0,0,.25);
    }

    #topPanel h2 {
      margin: 0 0 8px;
      font-size: 25px;
    }

    #status {
      margin: 8px 0;
      font-size: 15px;
      line-height: 1.45;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 10px;
      background: #0284c7;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #startButton {
      margin-top: 6px;
    }

    /* Custom scanning frame */
    #scanFrame {
      position: fixed;
      z-index: 8;
      width: min(78vw, 340px);
      height: min(48vh, 300px);
      left: 50%;
      top: 54%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: border-color .2s;
    }

    .corner {
      position: absolute;
      width: 42px;
      height: 42px;
      border-color: #ffffff;
      border-style: solid;
      filter: drop-shadow(0 0 5px rgba(0,0,0,.7));
    }

    .tl {
      top: 0; left: 0;
      border-width: 5px 0 0 5px;
      border-radius: 9px 0 0 0;
    }

    .tr {
      top: 0; right: 0;
      border-width: 5px 5px 0 0;
      border-radius: 0 9px 0 0;
    }

    .bl {
      bottom: 0; left: 0;
      border-width: 0 0 5px 5px;
      border-radius: 0 0 0 9px;
    }

    .br {
      bottom: 0; right: 0;
      border-width: 0 5px 5px 0;
      border-radius: 0 0 9px 0;
    }

    #scanHint {
      position: fixed;
      z-index: 9;
      left: 18px;
      right: 18px;
      top: calc(54% + min(24vh, 155px) + 16px);
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
      color: white;
      text-shadow: 0 2px 5px black;
      pointer-events: none;
    }

    #videoScreen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 30;
      background: #000;
      align-items: center;
      justify-content: center;
    }

    #finalVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #videoMessage {
      position: absolute;
      top: max(14px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      z-index: 32;
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      background: rgba(0,0,0,.78);
      font-size: 15px;
      line-height: 1.4;
    }

    #loadingSpinner {
      display: none;
      position: absolute;
      z-index: 33;
      left: calc(50% - 22px);
      top: calc(50% - 22px);
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255,255,255,.3);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      pointer-events: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #videoButton {
      display: none;
      position: absolute;
      z-index: 34;
      bottom: max(25px, env(safe-area-inset-bottom));
    }

    #videoErrorButton {
      display: none;
      position: absolute;
      z-index: 34;
      bottom: max(25px, env(safe-area-inset-bottom));
    }

    @media (max-height: 600px) {
      #topPanel { padding: 9px; }
      #topPanel h2 { font-size: 21px; }
      #scanFrame { height: 38vh; top: 57%; }
      #scanHint { top: 80%; }
    }
  </style>
</head>

<body>
  <div id="topPanel">
    <h2>Studio69 AR</h2>
    <div id="status">Start the camera, then scan either target picture.</div>
    <button id="startButton">Start Camera</button>
  </div>

  <div id="scanFrame" aria-hidden="true">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>
  </div>

  <div id="scanHint">Place the complete target picture inside the frame.</div>

  <a-scene
    id="arScene"
    mindar-image="
      imageTargetSrc: ./targets-multi.mind;
      autoStart: false;
      uiLoading: no;
      uiScanning: no;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="targetOne" mindar-image-target="targetIndex: 0"></a-entity>
    <a-entity id="targetTwo" mindar-image-target="targetIndex: 1"></a-entity>
  </a-scene>

  <div id="videoScreen">
    <video
      id="finalVideo"
      playsinline
      webkit-playsinline
      controls
      preload="auto"
    ></video>

    <div id="videoMessage">Preparing your Studio69 video...</div>
    <div id="loadingSpinner"></div>
    <button id="videoButton">Scan Another Picture</button>
    <button id="videoErrorButton">Retry Video</button>
  </div>

  <script>
    const scene = document.getElementById("arScene");
    const status = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    const scanFrame = document.getElementById("scanFrame");
    const scanHint = document.getElementById("scanHint");
    const videoScreen = document.getElementById("videoScreen");
    const video = document.getElementById("finalVideo");
    const videoMessage = document.getElementById("videoMessage");
    const loadingSpinner = document.getElementById("loadingSpinner");
    const videoButton = document.getElementById("videoButton");
    const videoErrorButton = document.getElementById("videoErrorButton");

    let started = false;
    let videoStarted = false;
    let selectedVideo = "";

    function setLoading(message) {
      videoMessage.textContent = message;
      loadingSpinner.style.display = "block";
      videoButton.style.display = "none";
      videoErrorButton.style.display = "none";
    }

    function setReady(message) {
      videoMessage.textContent = message;
      loadingSpinner.style.display = "none";
    }

    startButton.addEventListener("click", async () => {
      if (started) return;

      startButton.disabled = true;
      status.textContent = "Loading AR scanner... Please wait.";

      try {
        await scene.systems["mindar-image-system"].start();
        started = true;
        startButton.style.display = "none";
        status.textContent = "Scanning... Move your camera slowly over either target.";
        scanHint.textContent = "Keep the target picture steady inside the white frame.";
      } catch (error) {
        console.error("AR start error:", error);
        status.textContent = "Camera could not start. Check camera permission and reload.";
        startButton.disabled = false;
      }
    });

    async function playTargetVideo(videoFile) {
      if (videoStarted) return;

      videoStarted = true;
      selectedVideo = videoFile;

      status.textContent = "Target detected!";
      scanHint.style.display = "none";
      scanFrame.style.display = "none";
      startButton.style.display = "none";

      videoScreen.style.display = "flex";
      setLoading("Target detected! Loading your video...");

      video.pause();
      video.removeAttribute("src");
      video.load();
      video.src = videoFile;
      video.load();

      try {
        await scene.systems["mindar-image-system"].stop();
      } catch (error) {
        console.log("AR camera stop:", error);
      }

      scene.style.display = "none";

      try {
        await video.play();
      } catch (error) {
        console.log("Video autoplay blocked:", error);
        setReady("Video is ready. Tap Play to watch.");
      }
    }

    video.addEventListener("loadstart", () => {
      if (videoStarted) setLoading("Loading video...");
    });

    video.addEventListener("waiting", () => {
      if (videoStarted) setLoading("Buffering video... Please wait.");
    });

    video.addEventListener("canplay", () => {
      if (videoStarted) setReady("Video ready.");
    });

    video.addEventListener("playing", () => {
      if (videoStarted) setReady("Enjoy your Studio69 video!");
    });

    video.addEventListener("ended", () => {
      setReady("Video finished. Ready to scan again.");
      videoButton.style.display = "block";
    });

    video.addEventListener("error", () => {
      if (!videoStarted) return;
      loadingSpinner.style.display = "none";
      videoMessage.textContent = "Video could not load. Check your connection and retry.";
      videoErrorButton.style.display = "block";
    });

    videoErrorButton.addEventListener("click", async () => {
      if (!selectedVideo) return;

      setLoading("Retrying video...");
      video.pause();
      video.src = selectedVideo;
      video.load();

      try {
        await video.play();
      } catch (error) {
        console.log("Retry playback:", error);
        setReady("Tap Play on the video to try again.");
      }
    });

    document.getElementById("targetOne").addEventListener("targetFound", () => {
      playTargetVideo("./video.mp4");
    });

    document.getElementById("targetTwo").addEventListener("targetFound", () => {
      playTargetVideo("./video2.mp4");
    });

    videoButton.addEventListener("click", () => {
      window.location.reload();
    });

    scene.addEventListener("arError", () => {
      status.textContent = "AR could not start. Check camera permission and reload.";
      startButton.style.display = "inline-block";
      startButton.disabled = false;
    });
  </script>
</body>
</html>
