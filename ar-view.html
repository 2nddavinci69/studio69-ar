
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Studio69 AR</title>
  
<link rel="manifest" href="./manifest.json">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }

    #topPanel {
      position: fixed;
      z-index: 5;
      top: 12px;
      left: 12px;
      right: 12px;
      text-align: center;
      padding: 14px;
      background: rgba(10, 20, 40, 0.88);
      border-radius: 12px;
    }

    #topPanel h2 {
      margin: 0 0 8px;
    }

    #status {
      font-size: 14px;
      margin: 8px 0;
    }

    button {
      padding: 12px 20px;
      margin: 5px;
      border: 0;
      border-radius: 8px;
      background: #0284c7;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #videoScreen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      background: black;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    #finalVideo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: black;
    }

    #videoMessage {
      position: absolute;
      top: 15px;
      left: 10px;
      right: 10px;
      z-index: 22;
      text-align: center;
      padding: 10px;
      background: rgba(0, 0, 0, 0.65);
      border-radius: 8px;
    }

    #videoButton {
      position: absolute;
      z-index: 23;
      bottom: 25px;
      display: none;
    }

    a-scene {
      position: fixed !important;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <div id="topPanel">
    <h2>Studio69 AR</h2>
    <div id="status">
      Press Start Camera, then scan your picture.
    </div>
    <button id="startButton">Start Camera</button>
  </div>

  <a-scene
    id="arScene"
    mindar-image="
      imageTargetSrc: ./targets-multi.mind;
      autoStart: false;
      uiLoading: yes;
      uiScanning: yes;
    "
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded
  >
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <!-- First image: index 0 -->
    <a-entity
      id="targetOne"
      mindar-image-target="targetIndex: 0">
    </a-entity>

    <!-- Second image: index 1 -->
    <a-entity
      id="targetTwo"
      mindar-image-target="targetIndex: 1">
    </a-entity>

  </a-scene>

  <div id="videoScreen">
    <div id="videoMessage">Your video is ready.</div>

    <video
      id="finalVideo"
      playsinline
      webkit-playsinline
      controls
      preload="auto"
    ></video>

    <button id="videoButton">Scan Another Picture</button>
  </div>

  <script>
    const scene = document.getElementById("arScene");
    const status = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    const videoScreen = document.getElementById("videoScreen");
    const video = document.getElementById("finalVideo");
    const videoMessage = document.getElementById("videoMessage");
    const videoButton = document.getElementById("videoButton");

    let started = false;
    let videoStarted = false;

    startButton.addEventListener("click", async () => {
      if (started) return;

      status.textContent = "Starting camera...";

      try {
        await scene.systems["mindar-image-system"].start();
        started = true;
        startButton.style.display = "none";
        status.textContent = "Point your camera at either target image.";
      } catch (error) {
        status.textContent =
          "Camera could not start. Allow camera access and try again.";
        console.error(error);
      }
    });

    async function playTargetVideo(videoFile) {
      if (videoStarted) return;
      videoStarted = true;

      status.textContent = "Target found!";
      videoMessage.textContent = "Loading video...";
      videoButton.style.display = "none";

      video.pause();
      video.src = videoFile;
      video.load();

      videoScreen.style.display = "flex";

      try {
        await scene.systems["mindar-image-system"].stop();
      } catch (error) {
        console.log("AR camera stop:", error);
      }

      scene.style.display = "none";

      try {
        await video.play();
        videoMessage.textContent = "Enjoy your Studio69 video!";
      } catch (error) {
        videoMessage.textContent =
          "Tap Play on the video to start watching.";
      }
    }

    document
      .getElementById("targetOne")
      .addEventListener("targetFound", () => {
        playTargetVideo("./video.mp4");
      });

    document
      .getElementById("targetTwo")
      .addEventListener("targetFound", () => {
        playTargetVideo("./video2.mp4");
      });

    video.addEventListener("ended", () => {
      videoMessage.textContent = "Video finished. Ready to scan again.";
      videoButton.textContent = "Scan Another Picture";
      videoButton.style.display = "block";
    });

    videoButton.addEventListener("click", () => {
      window.location.reload();
    });

    scene.addEventListener("arError", () => {
      status.textContent =
        "AR could not start. Check camera permission and try again.";
    });
  </script>

</body>
</html>
