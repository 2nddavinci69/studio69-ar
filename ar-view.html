
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio69 AR</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #scanScreen {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      background: #101827;
      color: white;
    }

    #scanScreen h1 {
      color: #38bdf8;
    }

    #status {
      margin: 18px 0;
      line-height: 1.6;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 14px 22px;
      margin: 8px;
      font-size: 16px;
      font-weight: bold;
      color: white;
      background: #0284c7;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #arScene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      display: none;
    }

    /*
      Independent video screen.
      This element is outside the AR scene.
    */
    #videoScreen {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;

      width: 100% !important;
      height: 100% !important;
      height: 100dvh !important;

      margin: 0 !important;
      padding: 12px;
      border: 0;

      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;

      background: #000 !important;
      overflow: hidden;
      z-index: 2147483647 !important;

      transform: none !important;
      isolation: isolate;
      contain: layout paint;
    }

    #finalVideo {
      position: relative !important;
      display: block !important;

      width: 100% !important;
      height: auto !important;
      max-width: 1200px;
      max-height: calc(100dvh - 100px);

      margin: 0 auto !important;
      padding: 0;
      background: #000;

      object-fit: contain;
      transform: none !important;
      flex: 0 1 auto;
    }

    #videoMessage {
      color: #fff;
      text-align: center;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <section id="scanScreen">
    <h1>Studio69 AR</h1>
    <p>Scan your target picture to play the video.</p>
    <div id="status">Press Start Scanning.</div>
    <button id="startButton">Start Scanning</button>
  </section>

  <a-scene
    id="arScene"
    mindar-image="
      imageTargetSrc: ./target.mind;
      autoStart: false;
      uiLoading: no;
      uiError: no;
      uiScanning: no;
    "
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="imageTarget"
      mindar-image-target="targetIndex: 0">
    </a-entity>

  </a-scene>

  <!-- Independent video: NOT inside a-scene -->
  <section id="videoScreen">

    <video
      id="finalVideo"
      src="./video.mp4"
      controls
      playsinline
      webkit-playsinline
      preload="auto">
    </video>

    <div id="videoMessage">
      Video ready.
    </div>

    <button id="scanAgainButton">Scan Again</button>

  </section>

  <script>
    const scanScreen = document.getElementById("scanScreen");
    const status = document.getElementById("status");
    const startButton = document.getElementById("startButton");

    const arScene = document.getElementById("arScene");
    const imageTarget = document.getElementById("imageTarget");

    const videoScreen = document.getElementById("videoScreen");
    const finalVideo = document.getElementById("finalVideo");
    const videoMessage = document.getElementById("videoMessage");
    const scanAgainButton = document.getElementById("scanAgainButton");

    let scanning = false;
    let targetDetected = false;

    function waitForScene() {
      if (arScene.hasLoaded) {
        return Promise.resolve();
      }

      return new Promise(resolve => {
        arScene.addEventListener("loaded", resolve, { once: true });
      });
    }

    startButton.addEventListener("click", async () => {
      if (scanning) return;

      scanning = true;
      startButton.disabled = true;
      status.textContent = "Starting camera...";

      try {
        arScene.style.display = "block";

        await waitForScene();

        await arScene.systems["mindar-image-system"].start();

        status.textContent =
          "Camera ready. Point it at your target picture.";

      } catch (error) {
        console.error("AR start failed:", error);

        arScene.style.display = "none";
        scanning = false;
        startButton.disabled = false;

        status.textContent =
          "Camera failed to start. Check camera permission and files.";
      }
    });

    imageTarget.addEventListener("targetFound", async () => {
      if (targetDetected) return;
      targetDetected = true;

      status.textContent = "Target found. Opening video...";

      /*
        Display video independently before stopping AR.
      */
      scanScreen.style.display = "none";
      videoScreen.style.display = "flex";

      /*
        Stop MindAR and remove the AR scene.
        The video remains outside that scene.
      */
      try {
        await arScene.systems["mindar-image-system"].stop();
      } catch (error) {
        console.warn("AR stop warning:", error);
      }

      arScene.style.display = "none";

      if (arScene.isConnected) {
        arScene.remove();
      }

      /*
        The video does not listen for targetLost.
        Removing the picture cannot pause it.
      */
      try {
        await finalVideo.play();
        videoMessage.textContent = "Video playing.";

      } catch (error) {
        console.warn("Automatic playback was blocked:", error);

        videoMessage.textContent =
          "Press Play on the video controls to start.";
      }
    });

    finalVideo.addEventListener("error", () => {
      videoMessage.textContent =
        "Video failed to load. Check that video.mp4 exists in the main folder.";
    });

   
finalVideo.addEventListener("ended", () => {
  videoMessage.textContent =
    "Video finished. Ready to scan another picture.";

  scanAgainButton.textContent = "Scan Another Picture";
  scanAgainButton.style.display = "inline-block";
});

    scanAgainButton.addEventListener("click", () => {
      finalVideo.pause();
      window.location.reload();
    });
  </script>

</body>
</html>
