
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio69 AR Player</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

a-scene {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 1;
}

#message {
  position: fixed;
  z-index: 20;
  top: 12px;
  left: 12px;
  right: 12px;
  padding: 12px;
  background: #111e;
  color: #fff;
  border: 1px solid #ff7900;
  border-radius: 8px;
  text-align: center;
}

#startButton {
  margin-top: 8px;
  padding: 10px 18px;
  border: 0;
  border-radius: 6px;
  background: #ff7900;
  color: #111;
  font-weight: bold;
}

#videoScreen {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  width: 100%;
  height: 100%;
  background: #000;
}

#videoScreen video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}
</style>
</head>

<body>

<div id="message">
  Point your camera at the target image.
  <br>
  <button id="startButton" type="button">Start Camera</button>
</div>

<div id="videoScreen">
  <video id="fullVideo"
    src="./video.mp4"
    controls
    playsinline
    webkit-playsinline
    preload="auto">
  </video>
</div>

<a-scene
  id="arScene"
  mindar-image="imageTargetSrc: ./target.mind; autoStart: false; uiLoading: no; uiScanning: yes; uiError: no;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera position="0 0 0"
    look-controls="enabled: false"></a-camera>

  <a-entity id="targetEntity"
    mindar-image-target="targetIndex: 0"></a-entity>

</a-scene>

<script>
const scene = document.querySelector('#arScene');
const message = document.querySelector('#message');
const startButton = document.querySelector('#startButton');
const videoScreen = document.querySelector('#videoScreen');
const fullVideo = document.querySelector('#fullVideo');

let arStarted = false;
let videoStarted = false;

startButton.addEventListener('click', async () => {
  if (arStarted) return;

  startButton.disabled = true;
  startButton.textContent = 'Starting Camera...';

  try {
    const arSystem = scene.systems['mindar-image-system'];
    await arSystem.start();
    arStarted = true;
    startButton.textContent = 'Scanning...';
    message.firstChild.textContent =
      ' Point your camera at the target image. ';
  } catch (error) {
    startButton.disabled = false;
    startButton.textContent = 'Try Again';
    message.firstChild.textContent =
      ' Camera could not start. Check camera permission and HTTPS. ';
  }
});

document.querySelector('#targetEntity')
  .addEventListener('targetFound', async () => {
    if (videoStarted) return;
    videoStarted = true;

    message.style.display = 'none';
    videoScreen.style.display = 'block';

    try {
      const arSystem = scene.systems['mindar-image-system'];
      arSystem.stop();
    } catch (error) {
      console.warn('Could not stop AR camera:', error);
    }

    try {
      await fullVideo.play();
    } catch (error) {
      // If autoplay is blocked, the user can press Play.
      fullVideo.controls = true;
    }
  });

fullVideo.addEventListener('ended', () => {
  videoScreen.style.display = 'block';
});

window.addEventListener('error', () => {
  if (!videoStarted) {
    message.firstChild.textContent =
      'Error loading AR. Check target.mind and camera permissions.';
  }
});
</script>

</body>
</html>
