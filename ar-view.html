
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio69 AR Player</title>

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000;
  font-family: Arial, sans-serif;
}

a-scene {
  position: fixed !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  z-index: 1;
}

#message {
  position: fixed;
  z-index: 20;
  top: 12px;
  left: 12px;
  right: 12px;
  padding: 14px;
  background: #171717;
  color: #fff;
  border: 1px solid #ff7900;
  border-radius: 10px;
  text-align: center;
}

#startButton {
  margin-top: 10px;
  padding: 12px 22px;
  background: #ff7900;
  color: #111;
  border: 0;
  border-radius: 7px;
  font-size: 16px;
  font-weight: bold;
}

#videoScreen {
  display: none;
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  height: 100dvh;
  z-index: 10000;
  background: #000;
}

#fullVideo {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}

body.video-mode a-scene,
body.video-mode #message {
  display: none !important;
}
</style>
</head>

<body>

<div id="message">
  Studio69 AR<br>
  Point your camera at the target picture.
  <br>
  <button id="startButton" type="button">Start Camera</button>
</div>

<div id="videoScreen">
  <video
    id="fullVideo"
    src="./video.mp4"
    playsinline
    webkit-playsinline
    controls
    preload="auto">
  </video>
</div>

<a-scene
  id="arScene"
  mindar-image="imageTargetSrc: ./target.mind; autoStart: false; uiLoading: no; uiScanning: yes; uiError: no;"
  color-space="sRGB"
  renderer="colorManagement: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-camera
    position="0 0 0"
    look-controls="enabled: false">
  </a-camera>

  <a-entity
    id="targetEntity"
    mindar-image-target="targetIndex: 0">
  </a-entity>

</a-scene>

<script>
(() => {
  const scene = document.getElementById('arScene');
  const message = document.getElementById('message');
  const startButton = document.getElementById('startButton');
  const videoScreen = document.getElementById('videoScreen');
  const video = document.getElementById('fullVideo');
  const target = document.getElementById('targetEntity');

  let started = false;
  let found = false;

  startButton.addEventListener('click', async () => {
    if (started) return;

    startButton.disabled = true;
    startButton.textContent = 'Starting...';

    try {
      const arSystem = scene.systems['mindar-image-system'];

      if (!arSystem) {
        throw new Error('MindAR system not ready');
      }

      await arSystem.start();
      started = true;
      startButton.textContent = 'Scanning...';
      message.lastChild.textContent =
        ' Keep the target picture in front of the camera. ';
    } catch (error) {
      console.error(error);
      startButton.disabled = false;
      startButton.textContent = 'Try Again';
      message.lastChild.textContent =
        ' Camera failed to start. Check camera permission and reload. ';
    }
  });

  target.addEventListener('targetFound', async () => {
    if (found) return;
    found = true;

    // Switch to a separate video layer immediately.
    document.body.classList.add('video-mode');
    videoScreen.style.display = 'block';

    // Stop AR tracking/camera; the video is a separate HTML element.
    try {
      const arSystem = scene.systems['mindar-image-system'];
      if (arSystem) arSystem.stop();
    } catch (error) {
      console.warn('AR stop issue:', error);
    }

    // Do not pause this video when the target is lost.
    try {
      await video.play();
    } catch (error) {
      console.warn('Autoplay blocked; use the Play control.', error);
      video.controls = true;
    }
  });

  // Intentionally no targetLost handler that pauses the video.

  video.addEventListener('error', () => {
    console.error('Video could not load. Check video.mp4 filename.');
    if (found) {
      videoScreen.style.display = 'block';
      video.controls = true;
    }
  });
})();
</script>

</body>
</html>
