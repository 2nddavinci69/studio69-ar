<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio69 AR Player</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
    #message{position:fixed;z-index:10;top:12px;left:12px;right:12px;padding:12px;background:#0f172ae8;color:#fff;border-radius:8px;text-align:center}
    #startButton{margin-top:8px;padding:10px 18px;border:0;border-radius:6px;background:#f59e0b;color:#111827;font-weight:bold}
    a-scene{position:fixed;inset:0}
  </style>
</head>
<body>
  <div id="message">Point your camera at the target image.<br><button id="startButton" type="button">Start Video</button></div>
  <a-scene mindar-image="imageTargetSrc: target.mind; autoStart: true; uiLoading: no; uiScanning: yes; uiError: no;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
    <a-assets>
      <video id="ar-video" src="video.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
      <a-video src="#ar-video" position="0 0 0" height="0.552" width="1" rotation="0 0 0"></a-video>
    </a-entity>
  </a-scene>
  <script>
    const video = document.querySelector('#ar-video');
    const target = document.querySelector('#target-entity');
    const message = document.querySelector('#message');
    document.querySelector('#startButton').addEventListener('click', async () => {
      try { await video.play(); message.firstChild.textContent = 'Video ready. Point your camera at the target image.'; }
      catch (e) { message.firstChild.textContent = 'Tap Start Video again if playback is blocked.'; }
    });
    target.addEventListener('targetFound', () => { video.play().catch(() => {}); });
    target.addEventListener('targetLost', () => { video.pause(); });
    window.addEventListener('error', () => { message.firstChild.textContent = 'AR failed to start. Check camera permission, HTTPS hosting, and browser compatibility.'; });
  </script>
</body>
</html>
