
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio69 AR Test</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #071426;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      background: #102b4e;
      padding: 16px;
    }

    h1 {
      margin: 0;
      color: #38bdf8;
    }

    #status {
      padding: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    button {
      padding: 13px 20px;
      margin: 8px;
      border: 0;
      border-radius: 9px;
      background: #38bdf8;
      color: #071426;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #scanner {
      width: 100%;
      height: 65vh;
      position: relative;
      overflow: hidden;
    }

    #arScene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #videoScreen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      width: 100%;
      height: 100%;
      background: #000;
    }

    #movie {
      width: 100%;
      height: calc(100% - 70px);
      object-fit: contain;
      background: #000;
    }

    .hint {
      color: #cbd5e1;
      padding: 12px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Studio69 AR</h1>
    <p>Scan the picture. Watch the video.</p>
  </header>

  <div id="status">
    Loading AR system...
  </div>

  <button id="startButton" disabled>Start Camera</button>

  <div id="scanner">
    <a-scene
      id="arScene"
      mindar-image="
        imageTargetSrc: ./target.mind;
        autoStart: false;
        uiLoading: no;
        uiScanning: no;
        uiError: no;
      "
      embedded
      renderer="colorManagement: true"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-camera
        position="0 0 0"
        look-controls="enabled: false">
      </a-camera>

      <a-entity
        id="target"
        mindar-image-target="targetIndex: 0">
      </a-entity>
    </a-scene>
  </div>

  <div id="videoScreen">
    <video
      id="movie"
      src="./video.mp4"
      controls
      playsinline
      webkit-playsinline
      preload="metadata"
      muted>
    </video>

    <button id="backButton">Back to Camera</button>
  </div>

  <p class="hint">
    Use the exact picture from which target.mind was created.
  </p>

  <script>
    const scene = document.getElementById("arScene");
    const target = document.getElementById("target");
    const scanner = document.getElementById("scanner");
    const status = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    const videoScreen = document.getElementById("videoScreen");
    const movie = document.getElementById("movie");
    const backButton = document.getElementById("backButton");

    let sceneReady = false;
    let cameraStarted = false;
    let videoOpened = false;

    function showError(error) {
      console.error("Studio69 AR error:", error);

      const detail = error && error.message
        ? error.message
        : String(error || "Unknown error");

      status.textContent = "Error: " + detail;
      startButton.disabled = false;
      startButton.textContent = "Try Camera Again";
    }

    scene.addEventListener("loaded", () => {
      sceneReady = true;
      status.textContent =
        "AR system ready. Press Start Camera.";
      startButton.disabled = false;
    });

    startButton.addEventListener("click", async () => {
      if (cameraStarted) return;

      if (!sceneReady) {
        showError(
          new Error("AR system is still loading. Refresh and try again.")
        );
        return;
      }

      startButton.disabled = true;
      startButton.textContent = "Starting...";
      status.textContent = "Requesting camera access...";

      try {
        const arSystem = scene.systems["mindar-image-system"];

        if (!arSystem) {
          throw new Error(
            "MindAR system not found. Check that the library loaded."
          );
        }

        await arSystem.start();

        cameraStarted = true;
        status.textContent =
          "Camera started. Point it at your target picture.";
        startButton.textContent = "Camera Started";

      } catch (error) {
        showError(error);
      }
    });

    target.addEventListener("targetFound", async () => {
      if (videoOpened) return;

      videoOpened = true;
      scanner.style.display = "none";
      status.style.display = "none";
      startButton.style.display = "none";
      videoScreen.style.display = "block";

      movie.currentTime = 0;
      movie.muted = true;

      try {
        await movie.play();
      } catch (error) {
        console.error("Video playback error:", error);
        status.style.display = "block";
        status.textContent =
          "Video did not start automatically. Use the Play control.";
      }
    });

    backButton.addEventListener("click", () => {
      movie.pause();
      movie.currentTime = 0;
      videoOpened = false;

      videoScreen.style.display = "none";
      scanner.style.display = "block";
      status.style.display = "block";
      startButton.style.display = "inline-block";

      status.textContent =
        "Point the camera at the target picture again.";
    });

    movie.addEventListener("error", () => {
      console.error("Video file error:", movie.error);
      status.style.display = "block";
      status.textContent =
        "Video could not load. Check test-ar/video.mp4.";
    });
  </script>
</body>
</html>
