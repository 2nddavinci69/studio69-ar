
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio69 AR Test</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071426;
      color: white;
      text-align: center;
    }

    header {
      padding: 18px 12px;
      background: #102b4e;
    }

    h1 {
      margin: 0;
      color: #38bdf8;
      font-size: 25px;
    }

    #message {
      padding: 16px;
      line-height: 1.5;
    }

    #startButton, #backButton {
      border: 0;
      border-radius: 10px;
      padding: 14px 22px;
      margin: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #38bdf8;
      color: #071426;
    }

    #scanner {
      width: 100%;
      height: 65vh;
      position: relative;
      overflow: hidden;
    }

    #videoScreen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #000;
      width: 100%;
      height: 100%;
    }

    #movie {
      display: block;
      width: 100%;
      height: calc(100% - 75px);
      object-fit: contain;
      background: #000;
    }

    #videoScreen #backButton {
      margin: 10px;
    }

    .hint {
      color: #cbd5e1;
      padding: 12px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Studio69 AR</h1>
    <p>Scan the picture. Watch the video.</p>
  </header>

  <div id="message">
    Press Start Camera and point your camera at the target picture.
    <br>
    <button id="startButton">Start Camera</button>
  </div>

  <div id="scanner">
    <a-scene
      id="arScene"
      mindar-image="imageTargetSrc: ./target.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
      embedded
      color-space="sRGB"
      renderer="colorManagement: true, physicallyCorrectLights"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false">

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>
    </a-scene>
  </div>

  <div id="videoScreen">
    <video
      id="movie"
      src="./video.mp4"
      controls
      playsinline
      webkit-playsinline
      preload="metadata"
      muted>
    </video>
    <button id="backButton">Back to Camera</button>
  </div>

  <p class="hint">
    Test version — use your prepared target image.
  </p>

  <script>
    const scene = document.getElementById("arScene");
    const target = document.getElementById("target");
    const scanner = document.getElementById("scanner");
    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");
    const videoScreen = document.getElementById("videoScreen");
    const movie = document.getElementById("movie");
    const backButton = document.getElementById("backButton");

    let arStarted = false;
    let videoOpened = false;

    startButton.addEventListener("click", async () => {
      if (arStarted) return;

      startButton.disabled = true;
      startButton.textContent = "Starting camera...";

      try {
        await scene.systems["mindar-image-system"].start();
        arStarted = true;
        startButton.textContent = "Camera Started";
        message.innerHTML =
          "Camera is ready. Point it at your target picture.";
      } catch (error) {
        console.error("Camera start error:", error);
        startButton.disabled = false;
        startButton.textContent = "Try Camera Again";
        message.innerHTML =
          "Camera could not start. Allow camera permission and try again.";
        message.appendChild(startButton);
      }
    });

    target.addEventListener("targetFound", async () => {
      if (videoOpened) return;
      videoOpened = true;

      scanner.style.display = "none";
      message.style.display = "none";
      videoScreen.style.display = "block";

      movie.currentTime = 0;
      movie.muted = true;

      try {
        await movie.play();
      } catch (error) {
        console.warn("Autoplay blocked. Press Play.", error);
        videoScreen.insertAdjacentHTML(
          "afterbegin",
          '<p id="playHint" style="color:white">Press Play to start the video.</p>'
        );
      }
    });

    backButton.addEventListener("click", async () => {
      movie.pause();
      movie.currentTime = 0;
      videoOpened = false;

      const playHint = document.getElementById("playHint");
      if (playHint) playHint.remove();

      videoScreen.style.display = "none";
      scanner.style.display = "block";
      message.style.display = "block";
      message.innerHTML =
        "Point the camera at the target picture again.";

      if (!arStarted) {
        startButton.disabled = false;
        startButton.textContent = "Start Camera";
        message.appendChild(startButton);
      }
    });

    movie.addEventListener("ended", () => {
      videoOpened = false;
    });

    movie.addEventListener("error", () => {
      console.error("Video file could not be loaded:", movie.error);
    });
  </script>
</body>
</html>
