
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studio69 AR Video</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    #message {
      position: fixed;
      z-index: 20;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 14px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      text-align: center;
    }

    #startButton {
      margin-top: 12px;
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #f5c451;
      color: #111;
      font-size: 16px;
      font-weight: bold;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    /* Full-screen video, separate from the AR camera */
    #videoScreen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999999;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: #000;
    }

    #videoScreen.visible {
      display: block;
    }

    #movie {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #backButton {
      position: absolute;
      z-index: 1000000;
      top: max(12px, env(safe-area-inset-top));
      right: 12px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #f5c451;
      color: #111;
      font-size: 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="message">
    <strong>Studio69 AR</strong>
    <p>Tap Start Camera, then scan your target picture.</p>
    <button id="startButton" type="button">Start Camera</button>
  </div>

  <!-- AR scanner only: no video attached to the target -->
  <a-scene
    id="scanner"
    mindar-image="imageTargetSrc: ./target.mind; autoStart: true; uiLoading: no; uiScanning: yes; uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0">
    </a-entity>
  </a-scene>

  <!-- Independent mobile video screen -->
  <div id="videoScreen">
    <video
      id="movie"
      src="./video.mp4"
      controls
      playsinline
      webkit-playsinline
      preload="auto"
      muted>
    </video>

    <button id="backButton" type="button">Back to Camera</button>
  </div>

  <script>
    const scanner = document.getElementById("scanner");
    const target = document.getElementById("target");
    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");
    const videoScreen = document.getElementById("videoScreen");
    const movie = document.getElementById("movie");
    const backButton = document.getElementById("backButton");

    let scanningEnabled = false;
    let videoAlreadyStarted = false;

    startButton.addEventListener("click", () => {
      scanningEnabled = true;
      message.textContent =
        "Camera ready. Point it at your target picture.";
    });

    target.addEventListener("targetFound", async () => {
      if (!scanningEnabled || videoAlreadyStarted) return;

      videoAlreadyStarted = true;

      // Hide the camera completely from the screen.
      scanner.style.display = "none";
      message.style.display = "none";

      // Display the independent video.
      videoScreen.classList.add("visible");

      movie.currentTime = 0;
      movie.muted = true;

      try {
        await movie.play();
      } catch (error) {
        // If autoplay is blocked, tap Play on the video controls.
      }
    });

    // Keep the video playing even when the target disappears.
    target.addEventListener("targetLost", () => {
      // Intentionally do not pause or stop the video.
    });

    backButton.addEventListener("click", () => {
      movie.pause();
      videoScreen.classList.remove("visible");

      scanner.style.display = "block";
      message.style.display = "block";
      message.innerHTML =
        '<strong>Studio69 AR</strong><p>Tap Start Camera, then scan your target picture.</p><button id="startButton" type="button">Start Camera</button>';

      videoAlreadyStarted = false;
      scanningEnabled = false;

      document.getElementById("startButton").addEventListener("click", () => {
        scanningEnabled = true;
        message.textContent =
          "Camera ready. Point it at your target picture.";
      });
    });

    movie.addEventListener("error", () => {
      alert("Video could not load. Check that video.mp4 is in the test-ar folder.");
    });
  </script>
</body>
</html>
