
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Studio69 AR Video</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080d18;
      color: white;
    }

    #status {
      position: fixed;
      z-index: 10;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 13px;
      border-radius: 10px;
      text-align: center;
      background: rgba(0, 0, 0, .78);
      color: #fff;
    }

    #videoScreen {
      display: none;
      position: fixed;
      z-index: 1000;
      inset: 0;
      background: #000;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    #videoScreen.active {
      display: flex;
    }

    #videoScreen h2 {
      font-size: 20px;
      margin: 10px 0 14px;
      color: #f5c451;
    }

    #fullVideo {
      width: 100%;
      max-height: 78vh;
      object-fit: contain;
      background: #000;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 17px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #playButton {
      background: #f5c451;
      color: #111;
    }

    #closeButton {
      background: #fff;
      color: #111;
    }

    #hint {
      font-size: 13px;
      color: #ddd;
      text-align: center;
      margin-top: 10px;
    }

    a-scene {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="status">
    Studio69 AR<br>
    Camera is starting. Point it at your target picture.
  </div>

  <div id="videoScreen">
    <h2>Studio69 AR Video</h2>

    <video
      id="fullVideo"
      src="./video.mp4"
      controls
      playsinline
      webkit-playsinline
      preload="auto"
      style="width:100%;"
    ></video>

    <div class="controls">
      <button id="playButton">Play Video</button>
      <button id="closeButton">Back to Camera</button>
    </div>

    <div id="hint">
      The video continues even after the target picture is removed.
    </div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./target.mind;
                  autoStart: true;
                  uiLoading: yes;
                  uiScanning: yes;
                  uiError: yes;"
    color-space="sRGB"
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
    ></a-camera>

    <a-entity
      id="target"
      mindar-image-target="targetIndex: 0"
    ></a-entity>
  </a-scene>

  <script>
    const target = document.querySelector("#target");
    const scene = document.querySelector("a-scene");
    const status = document.querySelector("#status");
    const videoScreen = document.querySelector("#videoScreen");
    const video = document.querySelector("#fullVideo");
    const playButton = document.querySelector("#playButton");
    const closeButton = document.querySelector("#closeButton");

    let alreadyOpened = false;

    function openVideo() {
      videoScreen.classList.add("active");
      status.style.display = "none";

      // Try autoplay. If blocked, the Play button remains available.
      video.play().catch(() => {
        playButton.textContent = "Tap to Play Video";
      });
    }

    target.addEventListener("targetFound", () => {
      status.textContent = "Picture scanned! Opening your video.";

      if (!alreadyOpened) {
        alreadyOpened = true;
        openVideo();
      }
    });

    // Intentionally do not pause the video when the target is lost.
    target.addEventListener("targetLost", () => {
      status.textContent =
        "Picture is no longer visible. Your video can continue.";
    });

    playButton.addEventListener("click", () => {
      video.play()
        .then(() => {
          playButton.textContent = "Video Playing";
        })
        .catch(() => {
          status.textContent =
            "Please use the video player's Play control.";
        });
    });

    closeButton.addEventListener("click", () => {
      video.pause();
      videoScreen.classList.remove("active");
      status.style.display = "block";
      status.textContent =
        "Point the camera at the target picture to scan again.";
      alreadyOpened = false;
    });

    video.addEventListener("ended", () => {
      playButton.textContent = "Play Again";
    });

    video.addEventListener("play", () => {
      playButton.textContent = "Video Playing";
    });

    video.addEventListener("pause", () => {
      if (!video.ended) {
        playButton.textContent = "Resume Video";
      }
    });

    scene.addEventListener("arReady", () => {
      status.textContent =
        "Camera ready. Point it at your target picture.";
    });

    scene.addEventListener("arError", () => {
      status.textContent =
        "Camera could not start. Check camera permission and reload.";
    });

    video.addEventListener("error", () => {
      status.textContent =
        "Video could not load. Check that video.mp4 exists in this folder.";
    });
  </script>
</body>
</html>
