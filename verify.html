<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STUDIO69 - Anti-Counterfeit Verification</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        /* Locked Orange & Black Top Header */
        .header {
            width: 100%;
            background: #000000;
            border-bottom: 2px solid #ff6b00;
            padding: 15px 0;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-logo {
            font-size: 24px;
            font-weight: 900;
            color: #ff6b00;
            letter-spacing: 2px;
            margin: 0;
        }
        .header-sub {
            font-size: 10px;
            color: #9ca3af;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        .container {
            width: 90%;
            max-width: 420px;
            margin: 30px auto;
            background: #141b2d;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            text-align: center;
            border: 1px solid #263147;
        }
        .status-badge {
            font-size: 50px;
            margin-bottom: 10px;
        }
        .status-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .authentic { color: #10b981; }
        .duplicate { color: #ef4444; }
        .details-box {
            background: #0b0f19;
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            font-size: 14px;
            border: 1px solid #1f2937;
        }
        .details-box p {
            margin: 8px 0;
            color: #d1d5db;
        }
        .details-box strong {
            color: #ff6b00;
        }
        .btn-ar {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff6b00, #e65100);
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            margin-top: 15px;
            box-sizing: border-box;
            transition: transform 0.2s;
        }
        .btn-ar:hover {
            transform: scale(1.02);
        }
        .btn-reset {
            background: transparent;
            border: 1px solid #4b5563;
            color: #9ca3af;
            padding: 8px 14px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 25px;
        }
        .footer {
            font-size: 11px;
            color: #6b7280;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="header-logo">STUDIO69</div>
        <div class="header-sub">Global Anti-Counterfeit & WebAR Shield</div>
    </div>

    <div class="container" id="resultCard">
        <div class="status-badge" id="statusIcon">⏳</div>
        <div class="status-title" id="statusTitle">Verifying Product...</div>
        <p id="statusDesc" style="font-size: 14px; color: #9ca3af;">Checking security seal in database...</p>

        <div class="details-box" id="productDetails">
            <p>📦 <strong>Serial ID:</strong> <span id="serialDisplay">---</span></p>
            <p>🏷️ <strong>Batch No:</strong> <span id="batchDisplay">---</span></p>
            <p>🕒 <strong>First Scan:</strong> <span id="timeDisplay">---</span></p>
            <p>🔢 <strong>Total Scans:</strong> <span id="countDisplay">---</span></p>
        </div>

        <!-- WebAR Launch Button (Only shows for Authentic items) -->
        <a href="https://2nddavinci69.github.io/studio69-ar/" class="btn-ar" id="arButton" style="display:none;">
            ✨ Launch 3D AR Product Guide
        </a>

        <!-- Demo Reset Button for Testing -->
        <button class="btn-reset" onclick="resetDemo()">🔄 Reset Demo Scan (For Testing Only)</button>

        <div class="footer">
            Protected by <strong>Live Studio 69</strong> Security Network
        </div>
    </div>

    <script>
        // URL سے سیریل نمبر اور بیچ نمبر حاصل کرنا
        const params = new URLSearchParams(window.location.search);
        const serialId = params.get('id') || 'MED-99281-PK';
        const batchNo = params.get('batch') || 'NOV-2026-A1';

        document.getElementById('serialDisplay').innerText = serialId;
        document.getElementById('batchDisplay').innerText = batchNo;

        // ڈیٹا بیس کی جگہ براؤزر میموری (LocalStorage) یا لائیو گوگل شیٹ سے چیک کرنا
        const storageKey = 'studio69_scan_' + serialId;
        let scanRecord = JSON.parse(localStorage.getItem(storageKey));

        const now = new Date().toLocaleString('en-PK', { dateStyle: 'medium', timeStyle: 'short' });

        setTimeout(() => {
            if (!scanRecord) {
                // پہلی بار اسکین (100% Original)
                scanRecord = {
                    firstScanTime: now,
                    scanCount: 1
                };
                localStorage.setItem(storageKey, JSON.stringify(scanRecord));

                document.getElementById('statusIcon').innerText = '✅';
                document.getElementById('statusTitle').innerText = 'VERIFIED ORIGINAL';
                document.getElementById('statusTitle').className = 'status-title authentic';
                document.getElementById('statusDesc').innerText = 'This product is 100% genuine and authenticated by STUDIO69.';
                
                document.getElementById('timeDisplay').innerText = now + ' (Just Now)';
                document.getElementById('countDisplay').innerText = '1 (First Time)';
                document.getElementById('arButton').style.display = 'block';
                document.getElementById('resultCard').style.borderColor = '#10b981';

            } else {
                // دوسری یا تیسری بار اسکین (Duplicate / Fake Alert)
                scanRecord.scanCount += 1;
                localStorage.setItem(storageKey, JSON.stringify(scanRecord));

                document.getElementById('statusIcon').innerText = '🚨';
                document.getElementById('statusTitle').innerText = 'WARNING: DUPLICATE CODE';
                document.getElementById('statusTitle').className = 'status-title duplicate';
                document.getElementById('statusDesc').innerText = 'ALERT! This security code has already been scanned before. This product may be FAKE or TAMPERED.';
                
                document.getElementById('timeDisplay').innerText = scanRecord.firstScanTime;
                document.getElementById('countDisplay').innerText = scanRecord.scanCount + ' Times (Suspicious)';
                document.getElementById('arButton').style.display = 'none';
                document.getElementById('resultCard').style.borderColor = '#ef4444';
            }
        }, 700);

        // ڈیمو ری سیٹ بٹن (تاکہ آپ کلائنٹس کو بار بار چیک کروا سکیں)
        function resetDemo() {
            localStorage.removeItem(storageKey);
            location.reload();
        }
    </script>

</body>
</html>
