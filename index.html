
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Studio69 AR</title>

  <meta
    name="description"
    content="Scan a picture with Studio69 AR and watch its video."
  >

  <meta name="theme-color" content="#0284c7">

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #101827, #075985);
    }

    .container {
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 22px;
      background: rgba(255,255,255,0.08);
      box-shadow: 0 15px 45px rgba(0,0,0,0.25);
    }

    .logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: #0284c7;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
    }

    p {
      line-height: 1.7;
      color: #e0f2fe;
    }

    .start-button {
      display: block;
      margin-top: 26px;
      padding: 16px 20px;
      border-radius: 12px;
      background: #0284c7;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
    }

    .start-button:hover {
      background: #0369a1;
    }

    .note {
      margin-top: 22px;
      font-size: 13px;
      color: #cbd5e1;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">69</div>

    <h1>Studio69 AR</h1>

    <p>
      Scan the picture.<br>
      Watch the video.
    </p>

    <p>
      Point your mobile camera at a supported Studio69 target picture
      and watch its video play automatically.
    </p>

    <a class="start-button" href="./ar-view.html">
      Start Scanning
    </a>

    <p class="note">
      Camera permission is required to scan pictures.
    </p>
  </main>
</body>
</html>
